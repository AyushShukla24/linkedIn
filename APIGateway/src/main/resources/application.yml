spring:
  application:
    name: api-Gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: users-service
              uri: lb://USERS-SERVICE
              predicates:
                - Path=/api/v1/users/**
              filters:
                - StripPrefix=2

            - id: posts-service
              uri: lb://POSTS-SERVICE
              predicates:
                - Path=/api/v1/posts/**
              filters:
                - StripPrefix=2

            - id: connections-service
              uri: lb://CONNECTIONS-SERVICE
              predicates:
                - Path=/api/v1/connections/**
              filters:
                - StripPrefix=2

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8084/eureka/